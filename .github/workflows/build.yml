name: Build AppImage

on:
  schedule:
    - cron: '0 * * * *'  # Adjust as needed
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest upstream release info
        id: upstream
        run: |
          curl -s https://api.github.com/repos/crschnick/pdx_unlimiter/releases/latest > release.json
          echo "tag_name=$(jq -r .tag_name release.json)" >> "$GITHUB_OUTPUT"
          echo "asset_url=$(jq -r '.assets[0].browser_download_url' release.json)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Fetch latest local release info (if any)
        id: local
        run: |
          curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest > release.json || echo "{}" > release.json
          echo "tag_name=$(jq -r .tag_name release.json)" >> "$GITHUB_OUTPUT"

      - name: Exit if release already published
        if: steps.upstream.outputs.tag_name == steps.local.outputs.tag_name
        run: |
          echo "No new release."
          exit 0

      - name: Set up working directory
        run: |
          mkdir AppDir
          cd AppDir

      - name: Download latest release archive
        run: |
          curl -L "${{ steps.upstream.outputs.asset_url }}" -o AppDir/pdx_unlimiter-linux.zip

      - name: Extract release and prepare AppDir
        run: |
          unzip pdx_unlimiter-linux.zip -d pdxu

      - name: Create AppRun file
        run: |
          echo '#!/bin/sh' > AppDir/AppRun
          echo 'exec $APPDIR/pdxu/bin/pdxu' >> AppDir/AppRun
          chmod +x AppDir/AppRun

      - name: Create pdxu.desktop
        run: |
          echo -e "[Desktop Entry]\nType=Application\nName=Pdx-Unlimiter\nExec=pdxu\nIcon=pdxu\nCategories=Game;" > AppDir/pdxu.desktop
          
      - name: Create icon symlink
        run: |
          ln -s app-dir/resources/icon.png AppDir/pdxu.png

      - name: Clean up archive
        run: rm AppDir/pdx_unlimiter-linux.zip

      - name: Download appimagetool
        run: |
          curl -L https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool

      - name: Build AppImage
        run: ARCH=x86_64 ./appimagetool AppDir Pdx-Unlimiter.AppImage

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.upstream.outputs.tag_name }}
          files: Pdx-Unlimiter.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
